name: "Moss"
description: "Misty forest and foggy roads"
wm: "dwl"

files:
  # Alacritty terminal colors
  - source: "alacritty.toml"
    target: "~/.config/alacritty/alacritty.toml"
    action: "symlink"

  # Waybar styling
  - source: "waybar/style.css"
    target: "~/.config/waybar/style.css"
    action: "symlink"

  # Wofi launcher styling
  - source: "wofi.css"
    target: "~/.config/wofi/style.css"
    action: "symlink"

  # Fastfetch config
  - source: "fastfetch/config.jsonc"
    target: "~/.config/fastfetch/config.jsonc"
    action: "symlink"

  # dwl colors (Copy because we need to compile it)
  - source: "dwl-colors.h"
    target: "~/dwl/current-colors.h"
    action: "copy"

commands:
  # Recompile dwl with new borders
  - "cd ~/dwl && make clean && make && sudo make install"

  # Restart waybar
  - "(pkill waybar || true) && (waybar >/dev/null 2>&1 &)"

  # Set wallpaper to the foggy forest
  - "mkdir -p ~/.config/dwl/wallpapers"
  - "ln -sf ~/.config/dotmgr/themes/moss_dwl/wallpaper.png ~/.config/dwl/wallpapers/current"
  - "(pkill swaybg || true) && (swaybg -i ~/.config/dwl/wallpapers/current -m fill >/dev/null 2>&1 &)"
