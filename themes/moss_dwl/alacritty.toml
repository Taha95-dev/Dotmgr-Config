
[window]
padding = { x = 12, y = 12 }
opacity = 0.85
decorations = "None"

[font]
size = 9

[font.normal]
family = "JetBrains Nerd Mono"
style = "Regular"

[font.bold]
family = "JetBrains Nerd Mono"
style = "Bold"

[font.italic]
family = "JetBrains Nerd Mono"
style = "Italic"

[colors.primary]
background = "#151A1C"
foreground = "#D3C6AA"

[colors.normal]
black   = "#2E383C"
red     = "#E67E80"
green   = "#A7C080"
yellow  = "#DBBC7F"
blue    = "#7FBBB3"
magenta = "#D699B6"
cyan    = "#83C092"
white   = "#D3C6AA"

[colors.bright]
black   = "#4B565C"
red     = "#E67E80"
green   = "#A7C080"
yellow  = "#DBBC7F"
blue    = "#7FBBB3"
magenta = "#D699B6"
cyan    = "#83C092"
white   = "#D3C6AA"

[cursor]
style = { shape = "Underline", blinking = "On" }
blink_interval = 500

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[terminal.shell]
program = "/bin/zsh"
args = ["-c", "exec zsh; source ~/.zshrc"]

[env]
TERM = "xterm-256color"

