# ============================================================
# LIGHTSPEED TMUX CONFIG
# Prefix: Ctrl+Space (matches Neovim muscle memory)
# ============================================================

# Prefix key: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
setw -g mode-keys vi

# Split panes (current directory)
bind ` split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Use a blinking underline cursor
set -g cursor-style underline

# Vim-style navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind H resize-pane -L 10
bind J resize-pane -D 10
bind K resize-pane -U 10
bind L resize-pane -R 10

# Zoom pane
bind z resize-pane -Z

# Reload config
bind r source-file ~/.tmux.conf \; display "⚡ Config reloaded!"

# Default shell
set-option -g default-shell /bin/zsh

# Mouse support
set -g mouse on

# True color
set -g default-terminal "tmux-256color"

# Copy tmux selections to the system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

set-option -g focus-events on

# Transparent status bar (floating glass)
set -g status-style "fg=#00afff,bg=default"
set -g status-left ""
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style "fg=#666666,bg=default"
set -g window-status-current-style "fg=#00afff,bold,bg=default"
set -g status-right "#[fg=blue]🧠 #(top -bn1 | head -3 | awk '/%Cpu/{print $2}')% #[fg=green]💾 #(free -h | awk '/^Mem/ {print $3\"/\"$2}') #[fg=white]⏱️ %H:%M "
set -g status-right-length 100
